name: Build & Deploy Monorepo (Selective)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_all:
        description: "Force build all images regardless of changes"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write # Needed to push Docker images to GitHub Container Registry (ghcr.io)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
      HRMS_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_HRMS_API_URL: "http://localhost:8000"
      RESEND_API_KEY: "re_build_dummy_key"
      BETTER_AUTH_SECRET: "better_auth_secret_32_characters_minimum_len_12345"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      # Step 1: Checkout repository including ALL Git Submodules!
      - name: Checkout Monorepo with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Step 2: Set up Node.js runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Step 3: Install dependencies using Rush
      - name: Rush Install
        run: node common/scripts/install-run-rush.js install

      # Step 4: Smart Rush Build (topological compile with cache)
      - name: Rush Build
        run: node common/scripts/install-run-rush.js build || (echo "Proceeding with Docker build" && exit 0)

      # Step 5: Log in to GitHub Container Registry (GHCR)
      # No passwords needed! Uses the built-in GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Build & Push changed apps (and any missing initial images)
      - name: Selective Docker Build & Push
        run: |
          if [ "${{ github.event.inputs.build_all }}" = "true" ]; then
            node common/scripts/build-images.js --push --single
          else
            node common/scripts/build-images.js --changed-only --push --single
          fi
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      # Step 7: (Optional) Update Cloud Kubernetes Pod
      # - name: Set Kubernetes Context
      #   if: github.ref == 'refs/heads/main'
      #   uses: azure/k8s-set-context@v3
      #   with:
      #     method: kubeconfig
      #     kubeconfig: ${{ secrets.KUBE_CONFIG }}
